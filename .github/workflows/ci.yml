name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.ts"

  draw-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      # No image model in CI: check that the script parses and that the
      # offline parts (prompt, reference sheet, guide) run.
      - run: scripts/draw-portrait --print-prompt --name forge --role "a deploy agent" > /dev/null
      - run: scripts/draw-portrait --print-reference "$RUNNER_TEMP/ref.png"
      - run: scripts/draw-portrait --print-guide emotes/nova "$RUNNER_TEMP/guide.png"
      # Block art: a copy of a drawn set gets an ascii.yaml with every state.
      - run: |
          cp -r emotes/nova "$RUNNER_TEMP/nova"
          scripts/draw-portrait --blocks-only "$RUNNER_TEMP/nova" --blocks 16
          grep -q '^idle:' "$RUNNER_TEMP/nova/ascii.yaml"
          grep -q '^  close:' "$RUNNER_TEMP/nova/ascii.yaml"
          scripts/draw-portrait --blocks-only "$RUNNER_TEMP/nova" --blocks 16 --blocks-mode quadrant --blocks-name footer.yaml --blocks-states idle
          grep -q '^idle:' "$RUNNER_TEMP/nova/footer.yaml"
      # Paper to transparent: a cream border around a dark disc becomes see-through at the edge, opaque in the middle.
      - run: |
          mkdir -p "$RUNNER_TEMP/paper/idle"
          python -c "from PIL import Image, ImageDraw; im = Image.new('RGB', (64, 64), (245, 222, 195)); ImageDraw.Draw(im).ellipse((14, 14, 50, 50), fill=(60, 40, 30)); im.save('$RUNNER_TEMP/paper/idle/idle.png')"
          scripts/draw-portrait --matte-only "$RUNNER_TEMP/paper"
          python -c "from PIL import Image; a = Image.open('$RUNNER_TEMP/paper/idle/idle.png').getchannel('A'); assert a.getpixel((2, 20)) == 0 and a.getpixel((32, 32)) == 255, 'matte'"
          scripts/draw-portrait --sixel-only "$RUNNER_TEMP/paper" --sixel 24
          python -c "import json; d = json.load(open('$RUNNER_TEMP/paper/sixel.json')); s = d['frames']['idle']['default']; assert s.startswith(chr(27) + 'P') and s.endswith(chr(27) + chr(92)) and d['width'] == 24, 'sixel'"
